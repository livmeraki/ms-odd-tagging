<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>__PAGE_TITLE__ Tagged Scenario Explorer</title>
  <style>
    :root{--bg:#f6f8fb;--fg:#17202a;--card:#fff;--muted:#637083;--border:#d8dee8;--primary:#2458c6;--speed:#2878d0;--dynamic:#d05d26;--turn:#8b55c5;--lane:#2a9d8f;--boundary:#c68b21;--roadmark:#d24e75;--object:#5b6b7f;--shadow:0 2px 10px rgba(21,31,48,.08)}
    @media(prefers-color-scheme:dark){:root{--bg:#10151c;--fg:#edf2f8;--card:#181f29;--muted:#a8b3c3;--border:#303b4b;--primary:#8cb4ff;--speed:#6eaff1;--dynamic:#f39a6f;--turn:#c39bea;--lane:#64c7ba;--boundary:#e5b55d;--roadmark:#ef88a5;--object:#adbacb;--shadow:none}}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.45 system-ui,-apple-system,Segoe UI,sans-serif}header{padding:18px 24px;border-bottom:1px solid var(--border);background:var(--card)}h1{font-size:20px;margin:0 0 3px}header p{margin:0;color:var(--muted)}main{max-width:1500px;margin:auto;padding:18px;display:grid;gap:14px}.controls{display:flex;gap:14px;align-items:end;flex-wrap:wrap}.field{display:grid;gap:4px}.field span{color:var(--muted)}select,button,input{font:inherit}select,button{border:1px solid var(--border);border-radius:6px;background:var(--card);color:var(--fg);padding:7px 10px}button{cursor:pointer}button.primary{background:var(--primary);color:var(--card);border-color:var(--primary)}input[type=range]{width:min(560px,80vw)}.checks{display:flex;gap:12px;flex-wrap:wrap;align-items:center}.checks label{display:flex;gap:5px;align-items:center}.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:10px}.stat,.detail{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:10px 12px;box-shadow:var(--shadow)}.stat span{display:block;color:var(--muted)}.stat b{font-size:18px}.detail{min-height:44px}.plot{background:var(--card);border:1px solid var(--border);border-radius:8px;box-shadow:var(--shadow);padding:8px;min-width:0}.plot h2{font-size:14px;margin:2px 6px 5px;color:var(--muted);font-weight:600}.map-layout{display:grid;grid-template-columns:minmax(0,2fr) minmax(280px,1fr);gap:14px}svg{display:block;width:100%;height:auto}.map-svg{min-height:420px}.axis,.grid{stroke:var(--border);stroke-width:1}.grid{opacity:.65}.route{fill:none;stroke:var(--muted);stroke-width:2.5;opacity:.5}.elapsed{fill:none;stroke:var(--primary);stroke-width:4}.lane{fill:none;stroke:var(--lane);stroke-width:1.2;opacity:.62}.boundary{fill:none;stroke:var(--boundary);stroke-width:1.5;opacity:.7}.roadmark{fill:none;stroke:var(--roadmark);stroke-width:2;opacity:.82}.speed-line{fill:none;stroke:var(--speed);stroke-width:2.4}.cursor{stroke:var(--fg);stroke-width:1.5;stroke-dasharray:4 3}.ego{fill:var(--primary);stroke:var(--card);stroke-width:2}.object{fill:var(--object);opacity:.8}.event-speed{fill:var(--speed)}.event-dynamic{fill:var(--dynamic)}.event-turn{fill:var(--turn)}.event{opacity:.8;cursor:pointer}.event:hover,.event.selected{opacity:1;stroke:var(--fg);stroke-width:1.5}text{fill:var(--fg);font-size:11px}.tick{fill:var(--muted)}.tag{display:inline-block;border-radius:999px;background:color-mix(in srgb,var(--primary) 15%,transparent);padding:2px 8px;margin:2px}.legend{display:flex;gap:12px;flex-wrap:wrap;color:var(--muted)}.swatch{width:10px;height:10px;border-radius:2px;display:inline-block;margin-right:4px}.error{color:#c33}@media(max-width:860px){.map-layout{grid-template-columns:1fr}.map-svg{min-height:300px}}@media(max-width:480px){main{padding:10px}header{padding:14px}.stats{grid-template-columns:1fr 1fr}}
  </style>
</head>
<body>
<header><h1>__PAGE_TITLE__</h1><p>Trajectory, OD/LD context, and complete recording-level rule event intervals</p></header>
<main>
  <div class="controls">
    <button class="primary" id="play" type="button">Play</button>
    <label class="field"><span id="timeLabel">Frame 0</span><input id="frame" type="range" min="0" value="0" step="1"></label>
    <label class="field"><span>Scenario</span><select id="scenario"><option value="all">All scenarios</option></select></label>
    <div class="checks">
      <label><input id="showObjects" type="checkbox" checked>OD objects</label>
      <label><input id="showLanes" type="checkbox" checked>LD lanes</label>
      <label><input id="showBoundaries" type="checkbox" checked>boundaries</label>
      <label><input id="showRoadmarks" type="checkbox" checked>roadmarks</label>
    </div>
  </div>
  <div class="stats">
    <div class="stat"><span>Frames</span><b id="frameCount"></b></div>
    <div class="stat"><span>Duration</span><b id="duration"></b></div>
    <div class="stat"><span>Rule events</span><b id="eventCount"></b></div>
    <div class="stat"><span>Configuration</span><b id="configVersion"></b></div>
  </div>
  <div class="detail" id="detail" aria-live="polite"></div>
  <div class="map-layout">
    <section class="plot"><h2>LCS scene</h2><svg class="map-svg" id="map" viewBox="0 0 900 520" role="img" aria-label="Animated ego trajectory with OD objects, LD geometry, and current position"></svg></section>
    <section class="plot"><h2>Ego speed</h2><svg id="speed" viewBox="0 0 480 520" role="img" aria-label="Ego speed in metres per second over recording time"></svg></section>
  </div>
  <section class="plot"><h2>Tagged scenario intervals</h2><svg id="events" viewBox="0 0 1200 300" role="img" aria-label="Scenario event intervals on a shared time axis"></svg></section>
  <div class="legend"><span><i class="swatch" style="background:var(--speed)"></i>speed state</span><span><i class="swatch" style="background:var(--dynamic)"></i>dynamics</span><span><i class="swatch" style="background:var(--turn)"></i>turn</span></div>
</main>
<script>
const DATA=__SCENARIO_DATA__;
const $=id=>document.getElementById(id),NS='http://www.w3.org/2000/svg';
const frames=DATA.frames.map(r=>({frame:r[0],time:r[1],x:r[2],y:r[3],speed:r[4],heading:r[5]}));
const frameByIndex=new Map(frames.map(row=>[row.frame,row]));
const objectsByFrame=new Map(DATA.objectsByFrame||[]);
let playing=false,timer=null,selectedEvent=null;
function node(name,attrs={}){const n=document.createElementNS(NS,name);for(const [k,v] of Object.entries(attrs))n.setAttribute(k,v);return n}
function label(svg,value,x,y,cls=''){const n=node('text',{x,y,class:cls});n.textContent=value;svg.appendChild(n);return n}
function path(points,x,y){return points.map((p,i)=>`${i?'L':'M'}${x(p[0]).toFixed(1)},${y(p[1]).toFixed(1)}`).join(' ')}
function nearestFrame(index){return frames.reduce((best,row)=>Math.abs(row.frame-index)<Math.abs(best.frame-index)?row:best,frames[0])}
function visibleEvents(){const value=$('scenario').value;return DATA.events.filter(event=>value==='all'||event.scenario===value)}
function category(s){return s.includes('turn')?'turn':(s.includes('jerk')||s.includes('acceleration')?'dynamic':'speed')}
function allGeometry(){const values=frames.filter(r=>Number.isFinite(r.x)&&Number.isFinite(r.y)).map(r=>[r.x,r.y]);for(const group of Object.values(DATA.ld||{}))for(const feature of group)values.push(...feature[2]);return values}
const geometry=allGeometry(),xs=geometry.map(p=>p[0]),ys=geometry.map(p=>p[1]);
const minX=Math.min(...xs),maxX=Math.max(...xs),minY=Math.min(...ys),maxY=Math.max(...ys),pad=28;
const mapX=x=>pad+(x-minX)/(maxX-minX||1)*(900-pad*2),mapY=y=>520-pad-(y-minY)/(maxY-minY||1)*(520-pad*2);
function drawFeature(svg,feature,cls){svg.appendChild(node('path',{d:path(feature[2],mapX,mapY),class:cls}))}
function renderMap(index){const svg=$('map');svg.replaceChildren();
  if($('showLanes').checked)for(const feature of DATA.ld.laneLines)drawFeature(svg,feature,'lane');
  if($('showBoundaries').checked)for(const feature of DATA.ld.boundaries)drawFeature(svg,feature,'boundary');
  if($('showRoadmarks').checked)for(const feature of DATA.ld.roadmarks)drawFeature(svg,feature,'roadmark');
  const route=frames.filter(r=>Number.isFinite(r.x)&&Number.isFinite(r.y));svg.appendChild(node('path',{d:path(route.map(r=>[r.x,r.y]),mapX,mapY),class:'route'}));
  const elapsed=route.filter(r=>r.frame<=index);svg.appendChild(node('path',{d:path(elapsed.map(r=>[r.x,r.y]),mapX,mapY),class:'elapsed'}));
  if($('showObjects').checked)for(const obj of objectsByFrame.get(index)||[]){const length=Math.max(3,(obj[4]||2)*2),width=Math.max(3,(obj[5]||1)*2);const rect=node('rect',{x:mapX(obj[2])-length/2,y:mapY(obj[3])-width/2,width:length,height:width,rx:2,class:'object'});const angle=Number.isFinite(obj[6])?-obj[6]*180/Math.PI:0;rect.setAttribute('transform',`rotate(${angle} ${mapX(obj[2])} ${mapY(obj[3])})`);svg.appendChild(rect)}
  const current=nearestFrame(index);svg.appendChild(node('circle',{cx:mapX(current.x),cy:mapY(current.y),r:7,class:'ego'}));
  label(svg,'LCS x (m)',870,505,'tick').setAttribute('text-anchor','end');label(svg,'LCS y (m)',12,18,'tick');
}
function renderSpeed(index){const svg=$('speed');svg.replaceChildren();const valid=frames.filter(r=>Number.isFinite(r.speed));const left=44,right=15,top=20,bottom=32,maxSpeed=Math.max(1,...valid.map(r=>r.speed));const x=t=>left+t/(DATA.durationSec||1)*(480-left-right),y=s=>520-bottom-s/maxSpeed*(520-top-bottom);
  for(const f of [0,.25,.5,.75,1]){const yy=y(maxSpeed*f);svg.appendChild(node('line',{x1:left,x2:480-right,y1:yy,y2:yy,class:'grid'}));label(svg,(maxSpeed*f).toFixed(1),left-6,yy+4,'tick').setAttribute('text-anchor','end')}
  svg.appendChild(node('path',{d:path(valid.map(r=>[r.time,r.speed]),x,y),class:'speed-line'}));const current=nearestFrame(index);svg.appendChild(node('line',{x1:x(current.time),x2:x(current.time),y1:top,y2:520-bottom,class:'cursor'}));label(svg,'m/s',left,14,'tick');label(svg,'time (s)',465,508,'tick').setAttribute('text-anchor','end');
}
function renderEvents(index){const svg=$('events');svg.replaceChildren();const shown=visibleEvents(),scenarios=[...new Set(shown.map(e=>e.scenario))].sort();const left=220,right=20,top=22,lane=30,height=Math.max(100,top+scenarios.length*lane+38);svg.setAttribute('viewBox',`0 0 1200 ${height}`);const x=t=>left+t/(DATA.durationSec||1)*(1200-left-right);
  scenarios.forEach((scenario,row)=>{const y=top+row*lane;label(svg,scenario.replaceAll('_',' '),left-10,y+18,'tick').setAttribute('text-anchor','end');svg.appendChild(node('line',{x1:left,x2:1200-right,y1:y+13,y2:y+13,class:'grid'}));shown.filter(e=>e.scenario===scenario).forEach((event,eventIndex)=>{const key=`${event.scenario}|${event.startFrame}|${event.endFrame}`;const rect=node('rect',{x:x(event.startTime),y:y+3,width:Math.max(3,x(event.endTime)-x(event.startTime)),height:20,rx:3,class:`event event-${category(event.scenario)}${selectedEvent===key?' selected':''}`});rect.addEventListener('click',()=>{selectedEvent=key;$('frame').value=event.startFrame;render()});svg.appendChild(rect)})});
  const current=nearestFrame(index);svg.appendChild(node('line',{x1:x(current.time),x2:x(current.time),y1:top-7,y2:height-25,class:'cursor'}));for(const f of [0,.25,.5,.75,1])label(svg,(DATA.durationSec*f).toFixed(0),x(DATA.durationSec*f),height-7,'tick').setAttribute('text-anchor','middle');
}
function evidence(event){if(!event)return'';const entries=Object.entries(event.evidence||{}).filter(([,v])=>typeof v==='number'||typeof v==='string').slice(0,4);return entries.map(([k,v])=>`${k.replaceAll('_',' ')}: ${typeof v==='number'?v.toFixed(3):v}`).join(' | ')}
function render(){const index=Number($('frame').value),current=nearestFrame(index),active=DATA.events.filter(e=>e.startFrame<=index&&e.endFrame>=index),selected=DATA.events.find(e=>`${e.scenario}|${e.startFrame}|${e.endFrame}`===selectedEvent);$('timeLabel').textContent=`Frame ${index} | ${current.time.toFixed(2)} s | ${Number.isFinite(current.speed)?current.speed.toFixed(2)+' m/s':'speed n/a'}`;$('detail').innerHTML=`<b>Active:</b> ${active.length?active.map(e=>`<span class="tag">${e.scenario.replaceAll('_',' ')}</span>`).join(''):'none'}${selected?`<br><b>Selected:</b> ${selected.scenario.replaceAll('_',' ')} | frames ${selected.startFrame}-${selected.endFrame} | ${selected.startTime.toFixed(2)}-${selected.endTime.toFixed(2)} s${evidence(selected)?' | '+evidence(selected):''}`:''}`;renderMap(index);renderSpeed(index);renderEvents(index)}
function init(){$('frame').max=Math.max(...frames.map(r=>r.frame));$('frameCount').textContent=DATA.frameCount;$('duration').textContent=`${DATA.durationSec.toFixed(1)} s`;$('eventCount').textContent=DATA.events.length;$('configVersion').textContent=DATA.ruleConfigVersion;for(const scenario of [...new Set(DATA.events.map(e=>e.scenario))].sort())$('scenario').add(new Option(scenario.replaceAll('_',' '),scenario));$('frame').addEventListener('input',render);$('scenario').addEventListener('change',()=>{selectedEvent=null;render()});for(const id of ['showObjects','showLanes','showBoundaries','showRoadmarks'])$(id).addEventListener('change',render);$('play').addEventListener('click',()=>{playing=!playing;$('play').textContent=playing?'Pause':'Play';if(timer)clearInterval(timer);timer=playing?setInterval(()=>{let next=Number($('frame').value)+1;if(next>Number($('frame').max))next=0;$('frame').value=next;render()},100):null});render()}
init();
  </script>
</body>
</html>
