name: unit-tests

on:
  push:
    branches:
      - main
      - 'refactor/**'
  pull_request:

jobs:
  cleanup-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install package
        run: python -m pip install -e '.[dev]'
      - name: Compile package
        run: python -m compileall -q src
      - name: Run architecture and input-generation regression tests
        run: >-
          python -m pytest
          tests/unit/test_architecture_boundaries.py
          tests/unit/test_scenario_catalog.py
          tests/unit/test_bev_renderer.py
          tests/unit/test_bev_performance_paths.py
          tests/unit/test_input_builders.py
          tests/unit/test_frame_input.py
          tests/unit/test_frame_input_revised.py
          tests/unit/test_revised_bev.py
          tests/unit/test_canonical_odld_scene_identity.py
          tests/unit/test_static_od_persistence.py
          tests/unit/test_generation_profile.py
          tests/integration/test_pipeline.py

  supported-unit-suite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install package
        run: python -m pip install -e '.[dev]'
      - name: Run supported unit suite
        run: python -m pytest tests/unit --ignore=tests/unit/test_ld_topology.py

  candidate-topology-suite:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install package
        run: python -m pip install -e '.[dev]'
      - name: Run LD-topology candidate tests (advisory)
        run: python -m pytest tests/unit/test_ld_topology.py
