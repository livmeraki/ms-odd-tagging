[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ms-odd-tagging"
version = "0.1.0"
description = "Integrated autonomous-driving ODD scenario tagging pipeline."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "Pillow>=10",
]

[project.scripts]
ms-odd-tagging = "ms_odd_tagging.pipeline:main"
ms-odd-canonical = "ms_odd_tagging.input_generator.canonical_builder:main"
ms-odd-canonical-od = "ms_odd_tagging.input_generator.canonical:main"
ms-odd-canonical-odld = "ms_odd_tagging.input_generator.canonical_odld:main"
ms-odd-frame-inputs = "ms_odd_tagging.input_generator.frame_input_builder:main"
ms-odd-frame-inputs-standard = "ms_odd_tagging.input_generator.frame_input:main"
ms-odd-frame-inputs-revised = "ms_odd_tagging.input_generator.frame_input_revised:main"
ms-odd-validate-frames = "ms_odd_tagging.validator.frame_schema:main"
ms-odd-tag = "ms_odd_tagging.tagger.model_based.local_vllm:main"
ms-odd-rules = "ms_odd_tagging.tagger.rule_based.registry:main"
ms-odd-scenario-explorer = "ms_odd_tagging.visualization.scenario_explorer:main"
ms-odd-frame-gt-review = "ms_odd_tagging.gt_comparison.authoring:main"
ms-odd-following-lane = "ms_odd_tagging.scenarios.following_lane.pipeline:main"
ms-odd-lanelet2-poc = "ms_odd_tagging.lanelet2_poc.cli:main"
ms-odd-bev-lane-poc = "ms_odd_tagging.bev_lane_poc.cli:main"
ms-odd-ld-topology = "ms_odd_tagging.ld_topology.cli:main"
ms-odd-qwen-vlm-poc = "ms_odd_tagging.qwen_vlm_poc.cli:main"
ms-odd-qwen-vlm-review = "ms_odd_tagging.qwen_vlm_poc.visualization:main"

[project.optional-dependencies]
dev = [
  "pytest>=8",
]
lanelet2-poc = [
  "lanelet2>=1.2.2; platform_system == 'Linux'",
]
server = [
  "vllm==0.24.0",
  "tokenizers==0.22.2",
  "numpy==2.2.6",
  "regex==2026.6.28",
  "filelock==3.29.7",
  "sympy==1.14.0",
  "networkx==3.4.2",
  "tqdm==4.68.4",
  "typing-inspection==0.4.2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
