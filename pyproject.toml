[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ms-odd-tagging"
version = "0.1.0"
description = "Autonomous-driving motional-scenario tagging from OD/LD annotations and ego trajectories."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "Pillow>=10",
  "Shapely>=2.0",
]

[project.scripts]
ms-odd-tagging = "ms_odd_tagging.pipeline:main"
ms-odd-canonical = "ms_odd_tagging.canonical.builder:main"
ms-odd-frames = "ms_odd_tagging.frame_inputs.builder:main"
ms-odd-rules = "ms_odd_tagging.tagger.rule_based.registry:main"
ms-odd-lane = "ms_odd_tagging.scenarios.following_lane.pipeline:main"
ms-odd-topology = "ms_odd_tagging.ld_topology.cli:main"
ms-odd-vlm = "ms_odd_tagging.qwen_vlm_poc.cli:main"
ms-odd-gt = "ms_odd_tagging.gt.workspace:main"
ms-odd-validate = "ms_odd_tagging.validator.frame_schema:main"

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "numpy>=2.0",
]
server = [
  "vllm==0.24.0",
  "tokenizers==0.22.2",
  "numpy==2.2.6",
  "regex==2026.6.28",
  "filelock==3.29.7",
  "sympy==1.14.0",
  "networkx==3.4.2",
  "tqdm==4.68.4",
  "typing-inspection==0.4.2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
